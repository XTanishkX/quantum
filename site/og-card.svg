<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Qontinuum — the Quantum Engineering Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="360" fill="url(#glow1)"/>
  <circle cx="120" cy="560" r="320" fill="url(#glow2)"/>

  <!-- Bloch-sphere motif -->
  <g transform="translate(950,315)" stroke="#22d3ee" fill="none" opacity="0.55">
    <circle r="150" stroke-opacity="0.35"/>
    <ellipse rx="150" ry="52" stroke-opacity="0.5"/>
    <ellipse rx="52" ry="150" stroke-opacity="0.5"/>
    <line x1="0" y1="0" x2="96" y2="-116" stroke="url(#grad)" stroke-width="4"/>
    <circle cx="96" cy="-116" r="8" fill="#a78bfa" stroke="none"/>
  </g>

  <text x="90" y="150" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="46" fill="#e8ecf4">⚛️</text>
  <text x="150" y="152" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#e8ecf4">Qontinuum</text>

  <text x="88" y="300" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#e8ecf4">The Quantum</text>
  <text x="88" y="384" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#grad)">Engineering Platform</text>

  <text x="90" y="452" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="27" fill="#8b94a7">Statistical testing · cost &amp; execution intelligence · provider-agnostic</text>
  <text x="90" y="490" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="27" fill="#8b94a7">plugins · offline observability — for quantum programs.</text>

  <g font-family="SF Mono,ui-monospace,Menlo,monospace" font-size="22">
    <rect x="90" y="536" width="230" height="46" rx="10" fill="#10141f" stroke="#1d2333"/>
    <text x="110" y="565" fill="#34d399">$ pip install qontinuum</text>
  </g>
  <text x="352" y="565" font-family="SF Mono,ui-monospace,Menlo,monospace" font-size="20" fill="#8b94a7">Apache-2.0 · open source · v0.5.0 beta</text>
</svg>
