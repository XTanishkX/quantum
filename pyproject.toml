[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qontinuum"
version = "0.1.0"
description = "CI/CD, noise-aware regression testing, and cost intelligence for quantum programs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tanish Arora" }]
keywords = [
    "quantum",
    "quantum-computing",
    "ci",
    "testing",
    "qiskit",
    "devops",
    "cost-estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "qiskit-qasm3-import>=0.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
qontinuum = "qontinuum.cli:app"
qont = "qontinuum.cli:app"

[project.urls]
Homepage = "https://github.com/tanishkarora/qontinuum"
Issues = "https://github.com/tanishkarora/qontinuum/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qontinuum"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
