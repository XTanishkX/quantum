[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qontinuum"
version = "0.2.0"
description = "The quantum DevOps toolchain: statistical testing, cost intelligence, hardware routing, spend guards, and observability for quantum programs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tanish Arora" }]
keywords = [
    "quantum",
    "quantum-computing",
    "ci",
    "testing",
    "qiskit",
    "devops",
    "cost-estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "qiskit>=1.3",
    "qiskit-aer>=0.15",
    "qiskit-qasm3-import>=0.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.30"]
braket = ["amazon-braket-sdk>=1.80", "qiskit-braket-provider>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
qontinuum = "qontinuum.cli:app"
qont = "qontinuum.cli:app"

[project.urls]
Homepage = "https://github.com/XTanishkX/quantum"
Issues = "https://github.com/XTanishkX/quantum/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qontinuum"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # qiskit-ibm-runtime plugin machinery, not our code
    "ignore:.*IBMFractionalTranslationPlugin.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/qontinuum"]
omit = [
    # network/hardware paths exercised only with real accounts
    "src/qontinuum/hardware/ibm.py",
    "src/qontinuum/hardware/braket.py",
    # interactive long-runners
    "src/qontinuum/cli_groups/misc_cmds.py",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
# pragmatic gate: catch real breakage without fighting untyped SDK decorators
disable_error_code = ["union-attr", "arg-type", "assignment", "var-annotated", "misc"]
exclude = "tests/"
