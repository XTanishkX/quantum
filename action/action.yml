name: Qontinuum
description: >
  Run quantum tests with statistical regression checks and post a sticky PR
  comment with results and estimated hardware cost across providers.
author: qontinuum
branding:
  icon: activity
  color: purple

inputs:
  path:
    description: Directory (or file) to search for q_test_*.py files.
    default: "."
  seed:
    description: Simulator/transpiler seed for reproducible CI runs.
    default: ""
  python-version:
    description: Python version to run with.
    default: "3.12"
  install:
    description: >
      Pip requirement to install. Defaults to the released package with IBM
      noise-model support; set to "-e .[dev,ibm]" style specs to test a local
      checkout.
    default: "qontinuum[ibm]"
  comment:
    description: Post/update the sticky PR comment (needs pull-requests write).
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install qontinuum
      shell: bash
      run: pip install ${{ inputs.install }}

    - name: Run quantum tests
      id: qontinuum
      shell: bash
      continue-on-error: true
      run: |
        ARGS=()
        if [ -n "${{ inputs.seed }}" ]; then ARGS+=(--seed "${{ inputs.seed }}"); fi
        qont ci "${{ inputs.path }}" --md qontinuum-report.md "${ARGS[@]}"

    - name: Post sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('qontinuum-report.md')) {
            core.warning('qontinuum-report.md missing; skipping comment');
            return;
          }
          const body = fs.readFileSync('qontinuum-report.md', 'utf8');
          const marker = '<!-- qontinuum-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(
            (c) => c.body && c.body.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail if tests failed
      if: ${{ steps.qontinuum.outcome == 'failure' }}
      shell: bash
      run: |
        echo "qontinuum reported failures (see report above)"
        exit 1
